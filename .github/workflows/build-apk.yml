name: Build debug APK (Groq)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore debug keystore
        run: |
          if [ -z "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "DEBUG_KEYSTORE_BASE64 secret is not set. Set it with: gh secret set DEBUG_KEYSTORE_BASE64 --repo jeramyadams37-dev/roadhouse-overlay-groq < debug.keystore.b64"
            exit 1
          fi
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RoadHouse-Overlay-Groq-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
